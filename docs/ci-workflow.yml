# Flujo de integración continua de AURA.
#
# GitHub no permite crear archivos en .github/workflows/ con un token que no tenga
# el permiso «workflow». Para activarlo, copia este archivo a
# .github/workflows/ci.yml desde la web de GitHub (Add file → Create new file)
# o haz push con un token que incluya ese permiso.
#name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (tipos, lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test
      - run: npm run build

  bot:
    name: Bot (dependencias y carga de mÃ³dulos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix bot
      - name: Cargar los mÃ³dulos del bot
        run: |
          node --input-type=module -e "
            await import('./bot/src/commands.js');
            await import('./bot/src/assistant.js');
            await import('./bot/src/calendar-svg.js');
            await import('./bot/src/dates.js');
            console.log('mÃ³dulos del bot cargados');
          "
